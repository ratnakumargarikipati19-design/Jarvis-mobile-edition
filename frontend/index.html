<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS MOBILE CONTROL</title>
<style>
body { 
background-color: #050505; 
color: #00ffff; 
font-family: 'Courier New', monospace; 
text-align: center; 
padding: 20px; 
margin: 0;
 }
h1 { 
text-shadow: 0 0 10px #00ffff; 
margin-top: 20px;
 }
.subtitle { color: #888; margin-bottom: 30px; }
.btn { 
display: block; 
width: 90%; 
max-width: 400px;
margin: 15px auto; 
padding: 25px; 
font-size: 18px; 
font-weight: bold; 
background: #00ffff; 
color: #000; 
border: none; 
border-radius: 15px; 
box-shadow: 0 0 20px #00ffff; 
cursor: pointer; 
transition: all 0.3s;
 }
.btn:active { 
background: #ff0066; 
box-shadow: 0 0 20px #ff0066; 
color: white; 
transform: scale(0.95);
 }
.morning { 
background: #ff0066; 
color: white; 
box-shadow: 0 0 20px #ff0066; 
 }
</style>
</head>
<body>
<h1> JARVIS OS</h1>
<p class="subtitle">Mobile Command Center</p>
<button class="btn" onclick="send('youtube')"> OPEN YOUTUBE</button>
<button class="btn" onclick="send('google')"> OPEN GOOGLE</button>
<button class="btn" onclick="send('calculator')"> OPEN CALCULATOR</button>
<button class="btn morning" onclick="send('morning')"> GOOD MORNING SIR</button>
<script>
function send(action) {
 fetch('/command/' + action)
 .then(response => response.json())
 .then(data => {
 alert(data.reply);
});
 }
</script>
</body>
</html>
